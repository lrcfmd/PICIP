[project]
name = "picip"
version = "0.1.0"
description = "Probabilistic Isolation of Inorganic Crystalline Phases"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "pymatgen",
    "plotly",
    "pandas",
    "matplotlib",
    "boto3>=1.42.87",
    "structlog>=25.5.0",
    "jsonschema>=4.26.0",
]

[project.scripts]
model-run = "cmds.run:run_cli"
validate-model = "cmds.validate_model:main"

[tool.uv]
package = true

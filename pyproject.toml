[project]
name = "picip"
version = "0.1.0"
description = "Probabilistic Isolation of Inorganic Crystalline Phases"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "pymatgen",
    "plotly",
    "pandas",
    "matplotlib",
    "boto>=2.49.0",
    "boto3>=1.42.87",
]

[project.scripts]
model-run = "app.entrypoint:main"

[tool.uv]
package = true
